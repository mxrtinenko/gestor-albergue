[phases.setup]
nixPkgs = ["python311", "gcc", "stdenv.cc.cc.lib", "zlib"]

[phases.install]
cmds = [
    "python -m venv /app/.venv",
    ". /app/.venv/bin/activate && pip install --upgrade pip",
    ". /app/.venv/bin/activate && pip install -r requirements.txt --no-cache-dir"
]

[start]
# Esta línea es la clave: fuerza al sistema a buscar las librerías de C++ en la carpeta de Nix
cmd = "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/nix/var/nix/profiles/default/lib && . /app/.venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port 8000"